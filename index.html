<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Входящие заявки</title>
    <style>
      body {
        max-width: 40rem;
        margin: 2rem auto;
        padding: 0 1rem;
        font:
          1rem/1.5 system-ui,
          sans-serif;
      }
      textarea {
        box-sizing: border-box;
        display: block;
        width: 100%;
        margin: 0.5rem 0;
        padding: 0.5rem;
        font: inherit;
      }
      button {
        padding: 0.4rem 0.8rem;
        font: inherit;
      }
      pre {
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <h1>Входящие заявки</h1>
    <form>
      <label for="message">Текст заявки</label>
      <textarea id="message" rows="4"></textarea>
      <button type="submit">Разобрать заявку</button>
    </form>
    <pre id="result" aria-live="polite"></pre>

    <script type="module">
      const form = document.querySelector("form");
      const result = document.querySelector("#result");
      const message = document.querySelector("#message");
      const submitButton = form.querySelector('button[type="submit"]');

      let latestRequestId = 0;

      form.addEventListener("submit", async (event) => {
        event.preventDefault();

        const text = message.value.trim();

        // Не отправляем пустую заявку
        if (!text) {
          result.textContent = "Введите текст заявки.";
          message.focus();
          return;
        }

        const requestId = ++latestRequestId;

        // Сразу убираем результат предыдущей заявки
        result.textContent = "Обрабатываем заявку...";
        submitButton.disabled = true;

        try {
          const reply = await fetch("/api/triage", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify({ text }),
          });

          const data = await reply.json();

          // Не показываем устаревший ответ
          if (requestId !== latestRequestId) return;

          if (!reply.ok) {
            result.textContent = [
              "Не удалось обработать заявку.",
              data.error || "Проверьте введённые данные.",
            ].join("\n");
            return;
          }

          if (data.status === "ready") {
            result.textContent = [
              "Заявка обработана",
              `Тема: ${data.topic}`,
              "",
              "Черновик ответа:",
              data.draft,
            ].join("\n");
            return;
          }

          if (data.status === "manual_review") {
            result.textContent = [
              "Требуется ручная проверка",
              "",
              "Исходная заявка:",
              text,
              "",
              "Черновик ответа не сформирован. Менеджеру необходимо разобрать заявку вручную.",
            ].join("\n");
            return;
          }

          result.textContent = "Получен неизвестный формат ответа сервера.";
        } catch {
          if (requestId !== latestRequestId) return;

          result.textContent = [
            "Не удалось связаться с сервером.",
            "Проверьте соединение и попробуйте ещё раз.",
            "",
            "Исходная заявка:",
            text,
          ].join("\n");
        } finally {
          if (requestId === latestRequestId) {
            submitButton.disabled = false;
          }
        }
      });
    </script>
  </body>
</html>
